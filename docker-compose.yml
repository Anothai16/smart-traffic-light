services:
  # --- Frontend (React + Vite) ---
  frontend:
    build: ./smart-traffic-light-ui
    container_name: elstar-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./smart-traffic-light-ui:/app           # Hot Reload
      - /app/node_modules         # ป้องกัน node_modules หาย
    environment:
      # Browser ของผู้ใช้จะเรียก API ผ่าน localhost (พอร์ตที่เปิดออกมา)
      # - VITE_API_URL=http://localhost:3000
      - VITE_API_URL=/api
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend

  # --- Backend (Elysia + Bun) ---
  backend:
    build: ./smart-traffic-light-api
    container_name: elysia-backend
    ports:
      - "3000:3000"

    volumes:
      # Map โค้ดโปรเจกต์เข้าไปที่ /app
      - ./smart-traffic-light-api:/app
      - /app/node_modules

      - ./traffic_data:/traffic_data_storage
      - ./violation_data:/violation_data_storage
      - ./:/app_root

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - DB_HOST=host.docker.internal
      - DB_USER=admin
      - DB_PASSWORD=1234
      - DB_NAME=Smart_Traffic_Light
      - DB_PORT=3306
      - BACKEND_BASE_URL=
      
      # ✅ บังคับให้ Code เขียนลง Path นี้ (ซึ่งจะทะลุไปข้างนอกตาม Volume ด้านบน)
      - IMAGE_ROOT_PATH=/traffic_data_storage
      - VIOLATION_ROOT_PATH=/violation_data_storage
      
      - PORT=3000
      - LANE_1_NAME=Lane_1
      - LANE_1_FOLDER=Lane_1
      - LANE_2_NAME=Lane_2
      - LANE_2_FOLDER=Lane_2
      - LANE_3_NAME=Lane_3
      - LANE_3_FOLDER=Lane_3
      - LANE_4_NAME=Lane_4
      - LANE_4_FOLDER=Lane_4
  tunnel-quick:
      image: cloudflare/cloudflared:latest
      container_name: quick-tunnel
      network_mode: "host"  # ใช้ network เดียวกับเครื่องจริง เพื่อให้มองเห็น port 5173
      command: tunnel --url http://localhost:5173
      restart: always       # ถ้าดับให้เปิดใหม่เอง
